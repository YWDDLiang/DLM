protocol:
  name: sun_iclr_wyckoff_v1
  status: superseded_by_sun_iclr_stratified_wyckoff_v2
  superseded_by: protocol_v2.yaml
  created: 2026-07-10

task:
  primary: fully_unconditional_de_novo_mp20
  compatibility: atom_count_conditioned_mp20
  replication: alex_mp20
  oracle_tracks_are_headline_eligible: false

sample_identity:
  id_field: attempt_id
  stages:
    - discrete_plan
    - wyckoff_state
    - continuous_state
    - graph
    - refinement
    - relaxation
    - hull
    - sun
  preserve_across_world_sizes: true
  merge_order: attempt_id
  output_dependent_selection: forbidden
  replacement_sampling: forbidden

seeds:
  training: [11, 23, 47]
  sampling: [101, 202]
  derive_per_attempt: true
  derivation_fields:
    - protocol_name
    - experiment_id
    - training_seed
    - sampling_seed
    - attempt_id
    - stage

data:
  development: mp20_standard_train_val
  benchmark: mp20_standard_test
  blind_confirmation: mp20_v2_grouped
  scale_replication: alex_mp20
  novelty_reference: freeze_during_p0
  group_split_keys:
    - reduced_formula
    - prototype_cluster
  no_test_derived_conditioning: true

wyckoff_representation:
  fields:
    - space_group
    - orbit_count
    - wyckoff_letter
    - multiplicity
    - species
    - occupancy
    - lattice_metric
    - asymmetric_unit_free_coordinates
  ordered_structures_only: true
  fractional_occupancy: out_of_scope
  canonicalization: freeze_during_p1

models:
  discrete: typed_wyckoff_masked_diffusion
  continuous: space_group_equivariant_diffusion
  coupling: bidirectional_cross_state_messages
  discrete_revision: enabled
  refiner_trainable: true
  mp_doob: optional_ablation_only

refinement:
  development_steps: [200, 400]
  final_steps: 800
  same_checkpoint_across_main_comparisons: true
  extra_refiner_calls_at_test_time: forbidden

mlip:
  guide_candidate: chgnet
  held_out_candidates: [mattersim, mace_mp]
  freeze_assignments_before_method_results: true
  same_potential_hull_per_evaluator: true
  mixed_mlip_dft_hull: forbidden
  report_majority_consensus: true
  report_unanimous_consensus: true

metrics:
  primary: observed_msun_at_0p1_held_out_mlip
  key_secondary:
    - observed_strict_sun_signed_ehull_lt_0
    - unanimous_consensus_msun_at_0p1
    - novel_unique_rate
    - composition_validity
    - structure_validity
    - wyckoff_validity
    - symmetry_fidelity
    - coverage_recall
    - coverage_precision
    - raw_to_relaxed_rmsd
    - lattice_strain
    - symmetry_change_after_relaxation
    - end_to_end_gpu_hours
  ehull_thresholds_ev_per_atom: [0.0, 0.025, 0.05, 0.1, 0.2]

failure_accounting:
  denominator: all_submitted_attempts
  failures_count_as_non_sun:
    - parse
    - invalid_wyckoff_state
    - graph
    - refinement
    - relaxation
    - unsupported_element
    - missing_energy
    - missing_hull
    - cache_mismatch

sampling_budgets:
  smoke_per_setting: 256
  development_per_setting: 1000
  confirmation_per_setting: 3000
  final_per_main_method: 6000
  publication_target_per_main_method: 10000

promotion_gates:
  p1_representation:
    conversion_coverage_min: 0.95
    roundtrip_structure_match_min: 0.99
    multiplicity_atom_count_consistency: 1.0
  p2_smoke:
    parse_rate_min: 0.99
    wyckoff_consistency_min: 0.98
    graph_acceptance_min: 0.95
  p4_coupling:
    msun_gain_pp_min: 2.0
    novel_unique_drop_pp_max: 2.0
    graph_acceptance_min: 0.95
  final_oral_candidate:
    held_out_msun_gain_pp_min: 5.0
    held_out_ci_lower_pp_min: 2.0
    consensus_msun_gain_pp_min: 3.0
    strict_sun_noninferiority_pp: -1.0
    novel_unique_drop_pp_max: 2.0

statistics:
  primary_comparison: full_bidirectional_vs_best_one_way_wyckoff_baseline
  confidence_level: 0.95
  hierarchical_bootstrap_repetitions: 10000
  hierarchy: [training_seed, sampling_seed, attempt]
  multiple_comparison_correction: holm
  report_every_seed: true
