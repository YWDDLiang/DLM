[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h1a2-personal"
version = "0.1.0"
description = "Configurable H1-A2 and R03 research workflow"
requires-python = ">=3.10,<3.11"
dependencies = []

[project.scripts]
h1a2-assets = "h1a2_repro.assets:main"
h1a2-results = "h1a2_repro.report:main"
h1a2-personal-config = "h1a2_personal.config:main"

[tool.setuptools.packages.find]
where = ["src"]

