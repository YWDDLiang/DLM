[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h1a2-repro"
version = "0.1.0"
description = "Paper-facing H1-A2 crystal generation reproduction workflow"
requires-python = ">=3.10,<3.11"
dependencies = []

[project.scripts]
h1a2-assets = "h1a2_repro.assets:main"
h1a2-results = "h1a2_repro.report:main"

[tool.setuptools.packages.find]
where = ["src"]
